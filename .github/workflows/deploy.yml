name: Deploy OpenNext to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext
        run: npm run pages:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://rwvkmucurvdkrxxkuukt.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_P-u3qyutmfk9ITFd30SGEA_BrB68_Rn
          NEXT_PUBLIC_TMDB_API_KEY: d0e8d91e3b9f6091fc38629f10e2e049

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
